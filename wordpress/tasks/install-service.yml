# ------------------------------------------------------------------------------
# wordpress/tasks/install-service.yml
# ------------------------------------------------------------------------------

---

- block:

    - name: Install common APT package(s) for the wordpress host role
      ansible.builtin.apt:
        name:
          - acl
          - ca-certificates
          - git
          - gosu
          - jq
          - less
          - php
          - php-curl
          - php-gd
          - php-imagick
          - php-mysql
          - php-xml
          - php-zip
          - rsync
          - unzip
        install_recommends: no
      # When the PHP packages are installed, the Apache2 configuration must be
      # reloaded for Apache2 to recognise their presence.
      notify: Apache2 configuration changed

    - name: Download WP-CLI
      ansible.builtin.get_url:
        url: "\
          https://github.com/wp-cli/wp-cli/releases/download/\
          v2.12.0/wp-cli-2.12.0.phar"
        dest: /usr/local/sbin/wp
        owner: www-data
        group: www-data
        mode: '0755'

    - block:

        - name: >-
            Create required directories within /var/www for the www-data user
          ansible.builtin.file:
            path: /var/www/{{ item }}
            state: directory
          loop: [ '.ansible/', '.ansible/tmp/', '.cache/', '.wp-cli/' ]

        - name: Configure WP-CLI to be able to hard flush rewrite rules
          ansible.builtin.copy:
            dest: /var/www/.wp-cli/config.yml
            content: |
              apache_modules:
                - mod_rewrite

        - name: Install the WP-CLI find command's package
          ansible.builtin.command:
            cmd: wp package install wp-cli/find-command:2.0.6
            creates: /var/www/.wp-cli/packages/vendor/wp-cli/find-command

      become_user: www-data

  become: yes
